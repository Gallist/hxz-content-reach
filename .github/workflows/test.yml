name: offline tests

# It installs no project dependencies, uses no secrets, and never touches a real
# browser, Feishu, or the network beyond fetching the pinned actions.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: offline tests (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Byte-compile scripts and tests
        run: python -m compileall -q scripts tests

      - name: Offline unit tests (standard library only)
        run: python -m unittest discover -s tests -v

      - name: Syntax-check CDP collectors
        run: |
          node --check scripts/xhs_collect.mjs
          node --check scripts/douyin_collect.mjs
