name: Bug report
description: 报告一个可复现的问题 / Report a reproducible problem
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请**不要**粘贴任何真实凭据或个人数据：base token、table id、笔记 id、record_id、Cookie、逐字稿、作者标题、媒体 URL，以及截图里的个人信息。需要提供 `doctor` 输出时，`base_token` / `table_id` 只会显示是否设置与长度，请确认没有额外粘贴原值。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 描述实际结果与期望结果。不要包含真实数据。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 运行了哪条命令（用占位符代替真实链接）
        2. 在哪一步出错
        3. 完整错误信息（已脱敏）
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: 使用的命令
      description: 例如 `python scripts/xhs_pipeline.py fetch "<链接>"`；请用占位符代替真实链接。
    validations:
      required: false
  - type: textarea
    id: doctor
    attributes:
      label: doctor 输出（已脱敏）
      description: 可选。`python scripts/xhs_pipeline.py doctor` 的完整输出。它是离线诊断，不联网。
      render: text
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 / Ubuntu 24.04 / ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 版本
      description: python 与 node 版本；如涉及转写，附上 ffmpeg -version 首行。
      placeholder: python 3.11.x, node 22.x, ffmpeg ...
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我没有粘贴任何真实 token、table id、笔记 id、record_id、Cookie、逐字稿或个人数据。
          required: true
        - label: 我明白这是一个尚未作为成熟产品发布的导出副本（无公开仓库、无 Release、CI 未在远程跑过）。
          required: true
